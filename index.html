<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tạo QR Lịch Đẹp & Chuyên Nghiệp</title>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://npmcdn.com/flatpickr/dist/l10n/vn.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>

    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 480px; text-align: center; }
        h2 { margin-top: 0; color: #0078d4; }
        .form-group { margin-bottom: 15px; text-align: left; }
        label { display: block; margin-bottom: 6px; font-weight: 600; color: #333; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
        .row { display: flex; gap: 10px; }
        .row .form-group { flex: 1; }
        .btn { width: 100%; padding: 14px; background: #0078d4; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; text-decoration: none; display: inline-block; margin-top: 10px; }
        .btn:hover { background: #005a9e; }
        #qr-container { margin-top: 20px; display: flex; flex-direction: column; align-items: center; }
        canvas { border: 8px solid #fff; box-shadow: 0 2px 8px rgba(0,0,0,0.15); border-radius: 8px; display: none; }
        .hint { font-size: 12px; color: #666; margin-top: 4px; }
    </style>
</head>
<body>

<div class="card" id="app"></div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const dataParam = urlParams.get('data');

    if (dataParam) {
        // === GIAO DIỆN KHI QUÉT QR ===
        try {
            const payload = JSON.parse(decodeURIComponent(escape(atob(dataParam))));
            const sortedDates = payload.dates.map(d => new Date(d)).sort((a, b) => a - b);
            
            // Xây dựng file .ics chuẩn có Location và Emoji hiển thị đẹp
            let icsLines = [
                "BEGIN:VCALENDAR",
                "VERSION:2.0",
                "PRODID:-//Event Calendar//VN",
                "CALSCALE:GREGORIAN",
                "METHOD:PUBLISH"
            ];

            sortedDates.forEach(d => {
                const startDT = new Date(d);
                // Thời lượng mặc định 2 tiếng giống trận đấu thể thao
                const endDT = new Date(startDT.getTime() + (payload.duration || 120) * 60000); 

                icsLines.push("BEGIN:VEVENT");
                icsLines.push(`SUMMARY:${payload.icon} ${payload.title}`);
                icsLines.push(`DTSTART:${formatICSDate(startDT)}`);
                icsLines.push(`DTEND:${formatICSDate(endDT)}`);
                if (payload.location) icsLines.push(`LOCATION:${payload.location}`);
                if (payload.desc) icsLines.push(`DESCRIPTION:${payload.desc}`);
                icsLines.push("END:VEVENT");
            });

            icsLines.push("END:VCALENDAR");

            const icsContent = icsLines.join("\r\n");
            const blob = new Blob([icsContent], { type: 'text/calendar;charset=utf-8;' });
            const downloadUrl = URL.createObjectURL(blob);

            document.getElementById('app').innerHTML = `
                <h2>${payload.icon} ${payload.title}</h2>
                <p>Địa điểm: <b>${payload.location || 'Chưa xác định'}</b></p>
                <p>Đã sẵn sàng thêm <b>${payload.dates.length} ngày</b> vào Lịch Google/Điện thoại của bạn.</p>
                <br>
                <a id="downloadBtn" class="btn" href="${downloadUrl}" download="su-kien.ics">📅 THÊM TẤT CẢ VÀO LỊCH</a>
            `;

        } catch (e) {
            document.getElementById('app').innerHTML = `<h3>Lỗi đọc dữ liệu mã QR!</h3>`;
        }

    } else {
        // === GIAO DIỆN TẠO MÃ QR ===
        document.getElementById('app').innerHTML = `
            <h2>Tạo QR Lịch Đẹp</h2>
            
            <div class="row">
                <div class="form-group" style="flex: 0.3;">
                    <label>Biểu tượng:</label>
                    <select id="icon">
                        <option value="🎮">🎮 Esports</option>
                        <option value="⚽">⚽ Thể thao</option>
                        <option value="🏆">🏆 Giải đấu</option>
                        <option value="📅">📅 Sự kiện</option>
                        <option value="💰">💰 Thu tiền</option>
                        <option value="🔥">🔥 Gấp/Hot</option>
                    </select>
                </div>
                <div class="form-group" style="flex: 0.7;">
                    <label for="title">Tên sự kiện / Chủ đề:</label>
                    <input type="text" id="title" placeholder="Ví dụ: [R32] Trận 80: 1L vs 3rd">
                </div>
            </div>

            <div class="form-group">
                <label for="location">Địa điểm (Location):</label>
                <input type="text" id="location" placeholder="Ví dụ: Nhà thi đấu / Atlanta / Zoom">
            </div>

            <div class="form-group">
                <label for="multiDates">Chọn các ngày diễn ra:</label>
                <input type="text" id="multiDates" placeholder="Nhấp chọn nhiều ngày trên lịch...">
            </div>

            <div class="row">
                <div class="form-group">
                    <label for="time">Giờ bắt đầu:</label>
                    <input type="time" id="time" value="08:00">
                </div>
                <div class="form-group">
                    <label for="duration">Thời lượng:</label>
                    <select id="duration">
                        <option value="60">1 Tiếng</option>
                        <option value="120" selected>2 Tiếng</option>
                        <option value="180">3 Tiếng</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label for="description">Ghi chú chi tiết:</label>
                <textarea id="description" rows="2" placeholder="Ghi chú thêm..."></textarea>
            </div>

            <button class="btn" onclick="generateQRCode()">TẠO MÃ QR</button>
            <div id="qr-container">
                <canvas id="qrCanvas"></canvas>
            </div>
        `;

        flatpickr("#multiDates", {
            mode: "multiple",
            dateFormat: "Y-m-d",
            locale: "vn"
        });
    }

    function formatICSDate(dateObj) {
        const year = dateObj.getUTCFullYear();
        const month = String(dateObj.getUTCMonth() + 1).padStart(2, '0');
        const day = String(dateObj.getUTCDate()).padStart(2, '0');
        const hours = String(dateObj.getUTCHours()).padStart(2, '0');
        const minutes = String(dateObj.getUTCMinutes()).padStart(2, '0');
        const seconds = String(dateObj.getUTCSeconds()).padStart(2, '0');
        return `${year}${month}${day}T${hours}${minutes}${seconds}Z`;
    }

    function generateQRCode() {
        const icon = document.getElementById('icon').value;
        const title = document.getElementById('title').value.trim();
        const location = document.getElementById('location').value.trim();
        const datePicker = document.getElementById('multiDates')._flatpickr;
        const selectedDates = datePicker.selectedDates;
        const timeVal = document.getElementById('time').value;
        const duration = parseInt(document.getElementById('duration').value);
        const description = document.getElementById('description').value.trim();

        if (!title || selectedDates.length === 0) {
            alert("Vui lòng điền tên sự kiện và chọn ít nhất 1 ngày!");
            return;
        }

        const [hours, minutes] = timeVal.split(':').map(Number);
        
        const dateISOList = selectedDates.map(d => {
            const dt = new Date(d);
            dt.setHours(hours, minutes, 0);
            return dt.toISOString();
        });

        const payload = {
            icon: icon,
            title: title,
            location: location,
            desc: description,
            duration: duration,
            dates: dateISOList
        };

        const encodedData = btoa(unescape(encodeURIComponent(JSON.stringify(payload))));
        const resultUrl = `${window.location.origin}${window.location.pathname}?data=${encodedData}`;

        const canvas = document.getElementById('qrCanvas');
        new QRious({
            element: canvas,
            value: resultUrl,
            size: 260,
            level: 'L'
        });

        canvas.style.display = 'block';
    }
</script>

</body>
</html>
