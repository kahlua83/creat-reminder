<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reminders QR Code Generator</title>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://npmcdn.com/flatpickr/dist/l10n/vn.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>

    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 480px; text-align: center; }
        h2 { margin-top: 0; color: #0078d4; }
        .form-group { margin-bottom: 15px; text-align: left; }
        label { display: block; margin-bottom: 6px; font-weight: 600; color: #333; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
        .btn { width: 100%; padding: 14px; background: #0078d4; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; text-decoration: none; display: inline-block; }
        .btn:hover { background: #005a9e; }
        #qr-container { margin-top: 20px; display: flex; flex-direction: column; align-items: center; }
        canvas { border: 8px solid #fff; box-shadow: 0 2px 8px rgba(0,0,0,0.15); border-radius: 8px; display: none; }
        .hint { font-size: 12px; color: #666; margin-top: 4px; }
    </style>
</head>
<body>

<div class="card" id="app">
    <!-- Nội dung tự động thay đổi dựa trên tham số URL -->
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const dataParam = urlParams.get('data');

    if (dataParam) {
        // === GIAO DIỆN KHI NGƯỜI DÙNG QUÉT MÃ QR ===
        try {
            const payload = JSON.parse(decodeURIComponent(escape(atob(dataParam))));
            
            // Sắp xếp các ngày theo thứ tự tăng dần
            const sortedDates = payload.dates.map(d => new Date(d)).sort((a, b) => a - b);
            const firstDate = sortedDates[0];
            const endFirstDate = new Date(firstDate.getTime() + 30 * 60000);

            // Chuyển danh sách các ngày còn lại thành chuỗi RDATE/RDATE trong quy tắc lặp lại
            const rdateList = sortedDates.map(d => formatICSDate(d)).join(',');

            let icsLines = [
                "BEGIN:VCALENDAR",
                "VERSION:2.0",
                "PRODID:-//QR Reminders//EN",
                "CALSCALE:GREGORIAN",
                "METHOD:PUBLISH",
                "BEGIN:VEVENT",
                `SUMMARY:${payload.title}`,
                `DTSTART:${formatICSDate(firstDate)}`,
                `DTEND:${formatICSDate(endFirstDate)}`,
                `RDATE;VALUE=DATE-TIME:${rdateList}`,
                `PRIORITY:${payload.priority}`
            ];

            if (payload.desc) {
                icsLines.push(`DESCRIPTION:${payload.desc}`);
            }

            icsLines.push("END:VEVENT");
            icsLines.push("END:VCALENDAR");

            const icsContent = icsLines.join("\r\n");

            document.getElementById('app').innerHTML = `
                <h2>${payload.title}</h2>
                <p>Thêm <b>${payload.dates.length} ngày sự kiện</b> vào Lịch / Outlook / Google Calendar của bạn:</p>
                <br>
                <a id="downloadBtn" class="btn" href="#">📅 THÊM TẤT CẢ VÀO LỊCH</a>
            `;

            const blob = new Blob([icsContent], { type: 'text/calendar;charset=utf-8;' });
            const downloadUrl = URL.createObjectURL(blob);
            const dlBtn = document.getElementById('downloadBtn');
            dlBtn.href = downloadUrl;
            dlBtn.download = 'su-kien.ics';

        } catch (e) {
            document.getElementById('app').innerHTML = `<h3>Lỗi đọc dữ liệu mã QR!</h3>`;
        }

    } else {
        // === GIAO DIỆN TẠO MÃ QR ===
        document.getElementById('app').innerHTML = `
            <h2>Tạo QR Reminders / Lịch</h2>
            <div class="form-group">
                <label for="title">Chủ đề / Tên nhắc nhở:</label>
                <input type="text" id="title" placeholder="Ví dụ: [FANG-FPL] GIẢI ESPORTS SINH VIÊN">
            </div>
            <div class="form-group">
                <label for="multiDates">Chọn các ngày diễn ra sự kiện:</label>
                <input type="text" id="multiDates" placeholder="Nhấn vào đây để chọn nhiều ngày...">
                <div class="hint">Nhấp chọn nhiều ngày tùy ý trên bảng lịch.</div>
            </div>
            <div class="form-group">
                <label for="time">Giờ nhắc nhở:</label>
                <input type="time" id="time" value="09:00">
            </div>
            <div class="form-group">
                <label for="priority">Mức độ quan trọng:</label>
                <select id="priority">
                    <option value="9">Bình thường</option>
                    <option value="1">🔥 Khẩn cấp / Quan trọng</option>
                </select>
            </div>
            <div class="form-group">
                <label for="description">Ghi chú thêm:</label>
                <textarea id="description" rows="3" placeholder="Ghi chú..."></textarea>
            </div>
            <button class="btn" onclick="generateQRCode()">TẠO MÃ QR</button>
            <div id="qr-container">
                <canvas id="qrCanvas"></canvas>
            </div>
        `;

        flatpickr("#multiDates", {
            mode: "multiple",
            dateFormat: "Y-m-d",
            locale: "vn"
        });
    }

    function formatICSDate(dateObj) {
        const year = dateObj.getUTCFullYear();
        const month = String(dateObj.getUTCMonth() + 1).padStart(2, '0');
        const day = String(dateObj.getUTCDate()).padStart(2, '0');
        const hours = String(dateObj.getUTCHours()).padStart(2, '0');
        const minutes = String(dateObj.getUTCMinutes()).padStart(2, '0');
        const seconds = String(dateObj.getUTCSeconds()).padStart(2, '0');
        return `${year}${month}${day}T${hours}${minutes}${seconds}Z`;
    }

    function generateQRCode() {
        const title = document.getElementById('title').value.trim();
        const datePicker = document.getElementById('multiDates')._flatpickr;
        const selectedDates = datePicker.selectedDates;
        const timeVal = document.getElementById('time').value;
        const priority = document.getElementById('priority').value;
        const description = document.getElementById('description').value.trim();

        if (!title || selectedDates.length === 0) {
            alert("Vui lòng nhập tên nhắc nhở và chọn ít nhất 1 ngày!");
            return;
        }

        const [hours, minutes] = timeVal.split(':').map(Number);
        
        const dateISOList = selectedDates.map(d => {
            const dt = new Date(d);
            dt.setHours(hours, minutes, 0);
            return dt.toISOString();
        });

        const payload = {
            title: title,
            desc: description,
            priority: priority,
            dates: dateISOList
        };

        const encodedData = btoa(unescape(encodeURIComponent(JSON.stringify(payload))));
        const resultUrl = `${window.location.origin}${window.location.pathname}?data=${encodedData}`;

        const canvas = document.getElementById('qrCanvas');
        new QRious({
            element: canvas,
            value: resultUrl,
            size: 260,
            level: 'L'
        });

        canvas.style.display = 'block';
    }
</script>

</body>
</html>
