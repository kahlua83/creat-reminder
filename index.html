<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reminders QR Code Generator</title>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://npmcdn.com/flatpickr/dist/l10n/vn.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>

    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 480px; text-align: center; }
        h2 { margin-top: 0; color: #0078d4; }
        .form-group { margin-bottom: 15px; text-align: left; }
        label { display: block; margin-bottom: 6px; font-weight: 600; color: #333; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; background-color: #fff; }
        .row { display: flex; gap: 10px; }
        .row .form-group { flex: 1; }
        .checkbox-group { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; text-align: left; cursor: pointer; }
        .checkbox-group input { width: auto; cursor: pointer; }
        .checkbox-group label { margin-bottom: 0; cursor: pointer; font-weight: 600; color: #0078d4; }
        .btn { width: 100%; padding: 14px; background: #0078d4; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; text-decoration: none; display: inline-block; margin-top: 10px; }
        .btn:hover { background: #005a9e; }
        #qr-container { margin-top: 20px; display: flex; flex-direction: column; align-items: center; }
        canvas { border: 8px solid #fff; box-shadow: 0 2px 8px rgba(0,0,0,0.15); border-radius: 8px; display: none; }
        .desc-text { text-align: left; background: #f8f9fa; padding: 10px; border-radius: 6px; border-left: 3px solid #0078d4; font-size: 13px; white-space: pre-wrap; word-break: break-word; }
        #repeatOptions { display: none; background: #f0f4f8; padding: 12px; border-radius: 8px; margin-bottom: 15px; border: 1px dashed #0078d4; }
        #customLocationContainer { background: #f9fbfd; padding: 12px; border-radius: 8px; border: 1px solid #e1e8ed; margin-bottom: 15px; }
        .location-item { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
        .location-item span { font-size: 13px; font-weight: bold; width: 110px; text-align: left; color: #444; }
        .location-item input { flex: 1; padding: 8px; }
    </style>
</head>
<body>

<div class="card" id="app"></div>

<script>
    function utf8_to_b64(str) {
        return window.btoa(unescape(encodeURIComponent(str)));
    }

    function b64_to_utf8(str) {
        return decodeURIComponent(escape(window.atob(str)));
    }

    function formatICSDate(dateObj) {
        const year = dateObj.getUTCFullYear();
        const month = String(dateObj.getUTCMonth() + 1).padStart(2, '0');
        const day = String(dateObj.getUTCDate()).padStart(2, '0');
        const hours = String(dateObj.getUTCHours()).padStart(2, '0');
        const minutes = String(dateObj.getUTCMinutes()).padStart(2, '0');
        const seconds = String(dateObj.getUTCSeconds()).padStart(2, '0');
        return `${year}${month}${day}T${hours}${minutes}${seconds}Z`;
    }

    const urlParams = new URLSearchParams(window.location.search);
    const dataParam = urlParams.get('data');

    if (dataParam) {
        // === GIAO DIỆN QUÉT QR ===
        try {
            const rawJson = b64_to_utf8(dataParam);
            const payload = JSON.parse(rawJson);
            
            let icsLines = [
                "BEGIN:VCALENDAR",
                "VERSION:2.0",
                "PRODID:-//Event Calendar//VN",
                "CALSCALE:GREGORIAN",
                "METHOD:PUBLISH"
            ];

            const formattedDesc = payload.desc ? payload.desc.replace(/\r?\n/g, "\\n") : "";

            payload.dates.forEach(d => {
                const startDT = new Date(d.start);
                const endDT = new Date(d.end);

                icsLines.push("BEGIN:VEVENT");
                icsLines.push(`SUMMARY:${payload.icon} ${payload.title}`);
                icsLines.push(`DTSTART:${formatICSDate(startDT)}`);
                icsLines.push(`DTEND:${formatICSDate(endDT)}`);
                if (d.location) icsLines.push(`LOCATION:${d.location}`);
                if (formattedDesc) icsLines.push(`DESCRIPTION:${formattedDesc}`);
                icsLines.push("END:VEVENT");
            });

            icsLines.push("END:VCALENDAR");

            const icsContent = icsLines.join("\r\n");
            const blob = new Blob([icsContent], { type: 'text/calendar;charset=utf-8;' });
            const downloadUrl = URL.createObjectURL(blob);

            document.getElementById('app').innerHTML = `
                <h2>${payload.icon} ${payload.title}</h2>
                <p style="text-align:left;">📅 <b>Số ngày diễn ra:</b> ${payload.dates.length} ngày</p>
                ${payload.desc ? `<div class="desc-text"><b>📝 Ghi chú:</b>\n${payload.desc}</div>` : ''}
                <br>
                <a id="downloadBtn" class="btn" href="${downloadUrl}" download="su-kien.ics">📅 THÊM TẤT CẢ VÀO LỊCH</a>
            `;

        } catch (e) {
            console.error(e);
            document.getElementById('app').innerHTML = `
                <h3>⚠️ Không thể đọc dữ liệu mã QR!</h3>
                <p style="font-size: 13px; color: #666;">Mã QR bị hỏng hoặc dữ liệu quá dài.</p>
            `;
        }

    } else {
        // === GIAO DIỆN TẠO MÃ QR ===
        document.getElementById('app').innerHTML = `
            <h2>Tạo QR Lịch Đẹp</h2>
            
            <div class="row">
                <div class="form-group" style="flex: 0.35;">
                    <label>Icon:</label>
                    <select id="icon">
                        <option value="📅">📅 Sự kiện</option>
                        <option value="🎮">🎮 Esports</option>
                        <option value="⚽">⚽ Thể thao</option>
                        <option value="🏆">🏆 Giải đấu</option>
                        <option value="💰">💰 Thu tiền</option>
                        <option value="🔥">🔥 Gấp/Hot</option>
                    </select>
                </div>
                <div class="form-group" style="flex: 0.65;">
                    <label for="title">Tên sự kiện / Chủ đề:</label>
                    <input type="text" id="title" placeholder="Ví dụ: [J8-VEDC] Cung cấp internet">
                </div>
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="isRepeatMode" onchange="toggleRepeatOptions()">
                <label for="isRepeatMode">Bật chế độ lặp lại tự động</label>
            </div>

            <div id="repeatOptions">
                <div class="form-group">
                    <label for="repeatType">Tần suất lặp lại:</label>
                    <select id="repeatType" onchange="renderCustomLocationFields()">
                        <option value="daily">Hàng ngày (Daily)</option>
                        <option value="weekly">Hàng tuần (Weekly)</option>
                        <option value="monthly">Hàng tháng (Monthly)</option>
                        <option value="yearly">Hàng năm (Yearly)</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label id="dateLabel" for="multiDates">Chọn các ngày diễn ra:</label>
                <input type="text" id="multiDates" placeholder="Nhấn vào đây để chọn ngày...">
            </div>

            <!-- Tùy chọn Location -->
            <div class="checkbox-group">
                <input type="checkbox" id="isCustomLocation" onchange="toggleLocationMode()">
                <label for="isCustomLocation" style="color: #d9381e;">Nhập Địa điểm (Location) riêng cho từng ngày</label>
            </div>

            <div class="form-group" id="commonLocationGroup">
                <label for="location">Địa điểm (Location chung cho tất cả các ngày):</label>
                <input type="text" id="location" placeholder="Ví dụ: Tỉnh An Giang / Sân A / Zoom">
            </div>

            <div id="customLocationContainer" style="display: none;">
                <label style="margin-bottom: 10px; color: #0078d4;">📍 Nhập Địa điểm tương ứng từng ngày:</label>
                <div id="customLocationList">
                    <div style="font-size: 12px; color: #888;">Vui lòng chọn ngày ở ô trên trước...</div>
                </div>
            </div>

            <div class="row">
                <div class="form-group">
                    <label for="startTime">Giờ bắt đầu:</label>
                    <input type="time" id="startTime" value="06:00">
                </div>
                <div class="form-group">
                    <label for="endTime">Giờ kết thúc:</label>
                    <input type="time" id="endTime" value="17:00">
                </div>
            </div>

            <div class="form-group">
                <label for="description">Ghi chú chi tiết (Hỗ trợ xuống dòng):</label>
                <textarea id="description" rows="4" placeholder="Nhập ghi chú..."></textarea>
            </div>

            <button class="btn" onclick="generateQRCode()">TẠO MÃ QR</button>
            <div id="qr-container">
                <canvas id="qrCanvas"></canvas>
            </div>
        `;

        setTimeout(() => {
            initFlatpickr("multiple");
        }, 100);
    }

    let datePickerInstance = null;

    function initFlatpickr(mode) {
        if (datePickerInstance) {
            datePickerInstance.destroy();
        }
        datePickerInstance = flatpickr("#multiDates", {
            mode: mode,
            dateFormat: "Y-m-d",
            locale: "vn",
            disableMobile: true,
            onChange: function() {
                renderCustomLocationFields();
            }
        });
    }

    function toggleRepeatOptions() {
        const isRepeat = document.getElementById('isRepeatMode').checked;
        const repeatOptions = document.getElementById('repeatOptions');
        const dateLabel = document.getElementById('dateLabel');
        const dateInput = document.getElementById('multiDates');
        
        dateInput.value = "";
        if (isRepeat) {
            repeatOptions.style.display = "block";
            dateLabel.innerText = "Chọn khoảng thời gian (Từ ngày -> Đến ngày):";
            dateInput.placeholder = "Chọn Ngày bắt đầu và Ngày kết thúc...";
            initFlatpickr("range");
        } else {
            repeatOptions.style.display = "none";
            dateLabel.innerText = "Chọn các ngày diễn ra rời rạc:";
            dateInput.placeholder = "Nhấn vào đây để chọn các ngày...";
            initFlatpickr("multiple");
        }
        renderCustomLocationFields();
    }

    function toggleLocationMode() {
        const isCustom = document.getElementById('isCustomLocation').checked;
        const commonGroup = document.getElementById('commonLocationGroup');
        const customContainer = document.getElementById('customLocationContainer');

        if (isCustom) {
            commonGroup.style.display = "none";
            customContainer.style.display = "block";
            renderCustomLocationFields();
        } else {
            commonGroup.style.display = "block";
            customContainer.style.display = "none";
        }
    }

    function getSelectedDateList() {
        if (!datePickerInstance || !datePickerInstance.selectedDates.length) return [];
        const isRepeat = document.getElementById('isRepeatMode').checked;
        const selectedDates = datePickerInstance.selectedDates;
        let dates = [];

        if (isRepeat && selectedDates.length >= 2) {
            const repeatType = document.getElementById('repeatType').value;
            let currentDate = new Date(selectedDates[0]);
            const endDate = new Date(selectedDates[1]);

            while (currentDate <= endDate) {
                dates.push(new Date(currentDate));
                if (repeatType === 'daily') currentDate.setDate(currentDate.getDate() + 1);
                else if (repeatType === 'weekly') currentDate.setDate(currentDate.getDate() + 7);
                else if (repeatType === 'monthly') currentDate.setMonth(currentDate.getMonth() + 1);
                else if (repeatType === 'yearly') currentDate.setFullYear(currentDate.getFullYear() + 1);
            }
        } else if (!isRepeat) {
            dates = selectedDates.map(d => new Date(d));
        }

        return dates;
    }

    function renderCustomLocationFields() {
        const isCustom = document.getElementById('isCustomLocation').checked;
        if (!isCustom) return;

        const container = document.getElementById('customLocationList');
        const dates = getSelectedDateList();

        if (dates.length === 0) {
            container.innerHTML = `<div style="font-size: 12px; color: #888;">Vui lòng chọn ngày ở ô trên trước...</div>`;
            return;
        }

        let html = '';
        dates.forEach((d, idx) => {
            const dateStr = d.toLocaleDateString('vi-VN');
            const isoStr = d.toISOString().split('T')[0];
            html += `
                <div class="location-item">
                    <span>🗓️ ${dateStr}:</span>
                    <input type="text" class="custom-loc-input" data-date="${isoStr}" placeholder="Nhập địa điểm ngày ${dateStr}...">
                </div>
            `;
        });
        container.innerHTML = html;
    }

    function generateQRCode() {
        const icon = document.getElementById('icon').value;
        const title = document.getElementById('title').value.trim();
        const commonLocation = document.getElementById('location').value.trim();
        const isCustomLocation = document.getElementById('isCustomLocation').checked;

        if (!title) {
            alert("Vui lòng nhập tên sự kiện!");
            return;
        }

        const dates = getSelectedDateList();
        if (dates.length === 0) {
            alert("Vui lòng chọn ngày diễn ra!");
            return;
        }

        const startTimeVal = document.getElementById('startTime').value;
        const endTimeVal = document.getElementById('endTime').value;
        const description = document.getElementById('description').value.trim();

        const [startHours, startMinutes] = startTimeVal.split(':').map(Number);
        const [endHours, endMinutes] = endTimeVal.split(':').map(Number);

        // Lấy danh sách Location riêng nếu có chọn
        let customLocMap = {};
        if (isCustomLocation) {
            const locInputs = document.querySelectorAll('.custom-loc-input');
            locInputs.forEach(input => {
                customLocMap[input.getAttribute('data-date')] = input.value.trim();
            });
        }

        let datePairList = [];
        dates.forEach(d => {
            const startDT = new Date(d);
            startDT.setHours(startHours, startMinutes, 0);

            const endDT = new Date(d);
            endDT.setHours(endHours, endMinutes, 0);

            const isoDateKey = d.toISOString().split('T')[0];
            const loc = isCustomLocation ? (customLocMap[isoDateKey] || '') : commonLocation;

            datePairList.push({
                start: startDT.toISOString(),
                end: endDT.toISOString(),
                location: loc
            });
        });

        const payload = {
            icon: icon,
            title: title,
            desc: description,
            dates: datePairList
        };

        try {
            const jsonStr = JSON.stringify(payload);
            const encodedData = utf8_to_b64(jsonStr);
            const resultUrl = `${window.location.origin}${window.location.pathname}?data=${encodeURIComponent(encodedData)}`;

            const canvas = document.getElementById('qrCanvas');
            new QRious({
                element: canvas,
                value: resultUrl,
                size: 260,
                level: 'L'
            });

            canvas.style.display = 'block';
        } catch (err) {
            alert("Nội dung quá dài! Vui lòng rút ngắn ghi chú hoặc rút ngắn danh sách ngày.");
        }
    }
</script>

</body>
</html>
