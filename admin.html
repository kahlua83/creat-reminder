<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thống Kê QR Code - Work hard / Play hard</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📊</text></svg>">
    
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        h1 { color: #0078d4; margin: 0; font-size: 24px; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 25px; }
        .stat-card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); text-align: center; }
        .stat-card h3 { margin: 0; color: #666; font-size: 14px; font-weight: normal; }
        .stat-card .number { font-size: 28px; font-weight: bold; color: #0078d4; margin-top: 8px; }
        
        .table-container { background: white; border-radius: 10px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 14px; }
        th, td { padding: 12px; border-bottom: 1px solid #eee; }
        th { background-color: #f8f9fa; color: #333; font-weight: 600; }
        tr:hover { background-color: #f1f5f9; }
        .refresh-btn { padding: 8px 16px; background: #0078d4; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .refresh-btn:hover { background: #005a9e; }
        .loading { text-align: center; padding: 30px; color: #666; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>📊 Bảng Thống Kê Tạo QR</h1>
        <button class="refresh-btn" onclick="loadData()">🔄 Tải Lại Dữ Liệu</button>
    </div>

    <div class="stats-grid">
        <div class="stat-card">
            <h3>Tổng số lượt tạo QR</h3>
            <div class="number" id="totalCount">0</div>
        </div>
        <div class="stat-card">
            <h3>Tổng số ngày sự kiện</h3>
            <div class="number" id="totalDays">0</div>
        </div>
    </div>

    <div class="table-container">
        <h3>Danh Sách Lịch Sử Tạo QR</h3>
        <div id="loading" class="loading">Đang tải dữ liệu từ Google Sheets...</div>
        <table id="dataTable" style="display: none;">
            <thead>
                <tr>
                    <th>STT</th>
                    <th>Thời gian tạo</th>
                    <th>Icon & Tên sự kiện</th>
                    <th>Số ngày</th>
                    <th>Địa điểm</th>
                    <th>Ghi chú</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwWsp7idCLEfOfUtRPUcdmW_xRsVdVgaDEomXVhUIY9bZ9a5mhI_un-YNft5nEBR3fH/exec";

    // Callback xử lý dữ liệu trả về từ JSONP
    window.handleScriptData = function(data) {
        document.getElementById('loading').style.display = 'none';
        
        if (!Array.isArray(data) || data.length === 0) {
            document.getElementById('loading').style.display = 'block';
            document.getElementById('loading').innerText = 'Chưa có dữ liệu nào trong Google Sheet.';
            document.getElementById('dataTable').style.display = 'none';
            return;
        }

        document.getElementById('dataTable').style.display = 'table';

        let totalQr = data.length;
        let totalDaysCount = 0;
        let rowsHtml = '';

        data.slice().reverse().forEach((row, index) => {
            const days = parseInt(row[3]) || 0;
            totalDaysCount += days;

            rowsHtml += `
                <tr>
                    <td>${totalQr - index}</td>
                    <td>${row[0]}</td>
                    <td><b>${row[2] || ''} ${row[1] || ''}</b></td>
                    <td><span style="background:#e1f0fa; color:#0078d4; padding:3px 8px; border-radius:12px; font-weight:bold;">${days} ngày</span></td>
                    <td>${row[4] || '-'}</td>
                    <td style="white-space: pre-wrap;">${row[5] || '-'}</td>
                </tr>
            `;
        });

        document.getElementById('totalCount').innerText = totalQr;
        document.getElementById('totalDays').innerText = totalDaysCount;
        document.getElementById('tableBody').innerHTML = rowsHtml;
    };

    function loadData() {
        document.getElementById('loading').style.display = 'block';
        document.getElementById('loading').innerText = 'Đang tải dữ liệu từ Google Sheets...';
        document.getElementById('dataTable').style.display = 'none';

        // Xóa script old nếu có
        const oldScript = document.getElementById('jsonpScript');
        if (oldScript) oldScript.remove();

        // Tạo thẻ script gọi JSONP vượt rào cản CORS
        const script = document.createElement('script');
        script.id = 'jsonpScript';
        script.src = SCRIPT_URL + '?callback=handleScriptData&t=' + new Date().getTime();
        script.onerror = function() {
            document.getElementById('loading').innerText = '⚠️ Không thể tải dữ liệu! Vui lòng kiểm tra lại quyền truy cập Apps Script.';
        };
        document.body.appendChild(script);
    }

    window.onload = loadData;
</script>

</body>
</html>
